run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - bodyclose
    - contextcheck
    - nilerr
    - gosec

linters-settings:
  errcheck:
    check-type-assertions: true
  gosec:
    excludes:
      - G104  # handled by errcheck
